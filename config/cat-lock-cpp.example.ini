; Kopyala: %LOCALAPPDATA%\CatLockCpp\cat-lock-cpp.ini
; code boşsa uygulama kilitlemez.

[lock]
; 4-16 rakam
code=
; pause | ctrl_alt_l | both
hotkey=both

[auto]
cat_detect=1
; Modifier hariç eşzamanlı basılı tuş
cat_min_simultaneous=4
cat_window_ms=250
; Pencere içinde farklı tuş sayısı
cat_min_distinct=6
; Dakika, 0 = kapalı
idle_lock_min=3
; Tam ekran oyun/sunumda otomatik kilit yok
pause_in_fullscreen=1

[overlay]
enabled=1
; Karartma: 0 = yok, 77 = yaklaşık %30, 128 = yaklaşık %50, 255 = tam siyah
alpha=77

[led]
enabled=1
; Kilit açıldıktan sonraki sabit renk: RRGGBB
normal_color=8000FF
